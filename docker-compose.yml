version: '3.8'

services:
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - classsight-network

  face-service-fastapi:
    build:
      context: ./face-service-fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - classsight-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-classsight}
      - POSTGRES_USER=${POSTGRES_USER:-classsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-classsight_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - classsight-network

networks:
  classsight-network:
    driver: bridge

volumes:
  postgres-data:
