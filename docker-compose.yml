services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classsight}
      POSTGRES_USER: ${POSTGRES_USER:-classsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classsight_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-classsight} -d ${POSTGRES_DB:-classsight}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-classsight}
      POSTGRES_USER: ${POSTGRES_USER:-classsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classsight_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret}
      ATTENDANCE_CAPTURE_STORAGE_BACKEND: local
      ATTENDANCE_CAPTURE_STORAGE_PATH: /app/data/captures
      RECOGNITION_MODE: ${RECOGNITION_MODE:-async}
      CLASSSIGHT_PHASE1_ENABLED: ${CLASSSIGHT_PHASE1_ENABLED:-false}
      CLASSSIGHT_MODEL_DIR: /app/models
    volumes:
      - ./data/captures:/app/data/captures
      - ./models:/app/models:ro
      - ./exports:/app/exports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/health | grep -q 'UP'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend-vite:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend-spring:
        condition: service_healthy

volumes:
  postgres-data:
