server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: backend-spring
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:classsight}
    username: ${POSTGRES_USER:classsight}
    password: ${POSTGRES_PASSWORD:classsight_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here_change_in_production}

logging:
  level:
    com.classsight: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
