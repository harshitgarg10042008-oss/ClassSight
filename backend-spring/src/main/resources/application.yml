server:
  port: ${BACKEND_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  application:
    name: backend-spring
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:classsight}
    username: ${POSTGRES_USER:classsight}
    password: ${POSTGRES_PASSWORD:classsight_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:classsight}
    password: ${RABBITMQ_PASSWORD:classsight_rabbit_password}

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here_change_in_production}

face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8000}

privacy:
  retention-days: ${PRIVACY_RETENTION_DAYS:30}
  retention-cron: ${PRIVACY_RETENTION_CRON:0 0 3 * * *}

attendance:
  recognition:
    threshold: ${ATTENDANCE_RECOGNITION_THRESHOLD:0.6}
    mode: ${RECOGNITION_MODE:sync}
    edge-crop-enabled: ${EDGE_CROP_ENABLED:false}
  capture:
    backend: ${ATTENDANCE_CAPTURE_STORAGE_BACKEND:local}
    storage-path: ${ATTENDANCE_CAPTURE_STORAGE_PATH:./data/captures}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:classsight-captures}
      region: ${MINIO_REGION:us-east-1}
  analytics:
    defaulter-threshold: ${ATTENDANCE_DEFAULTER_THRESHOLD:75}

classsight:
  phase1:
    enabled: ${CLASSSIGHT_PHASE1_ENABLED:false}
    model-dir: ${CLASSSIGHT_MODEL_DIR:./models}
    yunet-model: ${CLASSSIGHT_YUNET_MODEL:face_detection_yunet_2023mar.onnx}
    sface-model: ${CLASSSIGHT_SFACE_MODEL:face_recognition_sface_2021dec.onnx}
    confidence-threshold: ${CLASSSIGHT_SFACE_THRESHOLD:0.50}
    detector-input-width: ${CLASSSIGHT_YUNET_WIDTH:320}
    detector-input-height: ${CLASSSIGHT_YUNET_HEIGHT:320}
    score-threshold: ${CLASSSIGHT_YUNET_SCORE_THRESHOLD:0.9}
    nms-threshold: ${CLASSSIGHT_YUNET_NMS_THRESHOLD:0.3}
    top-k: ${CLASSSIGHT_YUNET_TOP_K:5000}
    quality:
      blur-threshold: ${QUALITY_BLUR_THRESHOLD:30.0}
      min-brightness: ${QUALITY_MIN_BRIGHTNESS:35.0}
      max-brightness: ${QUALITY_MAX_BRIGHTNESS:220.0}
      min-liveness-texture: ${QUALITY_MIN_LIVENESS_TEXTURE:2.5}
      min-face-size-ratio: ${QUALITY_MIN_FACE_SIZE_RATIO:0.0005}

logging:
  level:
    com.classsight: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
