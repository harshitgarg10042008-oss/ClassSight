server:
  port: ${BACKEND_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  application:
    name: backend-spring
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:classsight}
    username: ${POSTGRES_USER:classsight}
    password: ${POSTGRES_PASSWORD:classsight_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here_change_in_production}

face-service:
  url: ${FACE_SERVICE_URL:http://localhost:8000}

privacy:
  retention-days: ${PRIVACY_RETENTION_DAYS:30}
  retention-cron: ${PRIVACY_RETENTION_CRON:0 0 3 * * *}

attendance:
  recognition:
    threshold: ${ATTENDANCE_RECOGNITION_THRESHOLD:0.6}
  capture:
    backend: ${ATTENDANCE_CAPTURE_STORAGE_BACKEND:local}
    storage-path: ${ATTENDANCE_CAPTURE_STORAGE_PATH:./data/captures}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:classsight-captures}
      region: ${MINIO_REGION:us-east-1}
  analytics:
    defaulter-threshold: ${ATTENDANCE_DEFAULTER_THRESHOLD:75}

logging:
  level:
    com.classsight: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
