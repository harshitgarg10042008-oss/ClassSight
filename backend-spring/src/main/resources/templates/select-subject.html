<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subject - ClassSight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .assignment-card { transition: all 0.2s ease; cursor: pointer; }
        .assignment-card:hover { transform: translateY(-2px); }
        .selected-card { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1) !important; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <header class="flex justify-between items-center glass-panel p-4 rounded-xl">
            <div class="flex items-center space-x-4">
                <button onclick="window.location.href='/select-room'" class="text-slate-400 hover:text-white transition-colors">
                    &larr; Back
                </button>
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">ClassSight</h1>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">Sign Out</button>
        </header>

        <main class="space-y-8">
            <div class="glass-panel p-4 rounded-xl border border-slate-700/50 bg-slate-800/30 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Selected Context</p>
                    <p class="text-sm font-medium text-slate-200 mt-1" id="context-info">Loading...</p>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-semibold mb-4 text-slate-200">Select Class & Subject</h2>
                <div id="assignments-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Assignments loaded here -->
                    <div class="animate-pulse flex space-x-4 glass-panel p-4 rounded-xl">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-slate-700 rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-slate-700/50">
                <button id="nextBtn" disabled onclick="goNext()"
                        class="py-3 px-8 bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-600 hover:to-emerald-600 text-white font-semibold rounded-lg shadow-lg transform transition-all hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0">
                    Start Camera &rarr;
                </button>
            </div>
        </main>
    </div>

    <script>
        let allAssignments = [];
        let selectedAssignmentId = null;

        async function init() {
            // Check context
            const roomId = sessionStorage.getItem('selectedRoomId');
            const cameraId = sessionStorage.getItem('selectedCameraId');
            
            if (!roomId || !cameraId) {
                window.location.href = '/select-room';
                return;
            }

            document.getElementById('context-info').textContent = `Room ID: ${roomId} | Camera ID: ${cameraId}`;

            try {
                const res = await fetch('/teacher/assignments');
                
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/login';
                    return;
                }

                allAssignments = await res.json();
                renderAssignments();
            } catch (err) {
                console.error("Failed to load assignments", err);
                document.getElementById('assignments-container').innerHTML = 
                    `<div class="col-span-full text-red-400 p-4 glass-panel rounded-xl">Failed to load assignments. Please try again.</div>`;
            }
        }

        function renderAssignments() {
            const container = document.getElementById('assignments-container');
            if (allAssignments.length === 0) {
                container.innerHTML = `<div class="col-span-full text-slate-400 italic p-4 glass-panel rounded-xl">No active class assignments found for your account.</div>`;
                return;
            }

            container.innerHTML = allAssignments.map(assignment => `
                <div onclick="selectAssignment(${assignment.id})" id="assignment-${assignment.id}" 
                     class="assignment-card glass-panel p-5 rounded-xl border border-slate-700 hover:border-slate-500">
                    <div class="flex justify-between items-start mb-2">
                        <span class="px-2 py-1 bg-blue-500/20 text-blue-300 text-xs font-bold rounded border border-blue-500/30">
                            ${assignment.classSection.name}
                        </span>
                        <span class="text-xs text-slate-400">${assignment.classSection.academicYear}</span>
                    </div>
                    <h3 class="font-semibold text-lg text-white mt-1">${assignment.subject.name}</h3>
                    <p class="text-sm text-slate-400 mt-1">${assignment.subject.code || ''}</p>
                </div>
            `).join('');
        }

        window.selectAssignment = function(assignmentId) {
            if (selectedAssignmentId) {
                document.getElementById(`assignment-${selectedAssignmentId}`).classList.remove('selected-card');
            }
            selectedAssignmentId = assignmentId;
            document.getElementById(`assignment-${assignmentId}`).classList.add('selected-card');
            
            document.getElementById('nextBtn').disabled = false;
        };

        window.goNext = function() {
            if (selectedAssignmentId) {
                sessionStorage.setItem('selectedAssignmentId', selectedAssignmentId);
                window.location.href = '/capture';
            }
        };

        window.logout = async function() {
            await fetch('/auth/logout');
            window.location.href = '/login';
        };

        // Run init
        init();
    </script>
</body>
</html>
