<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture - ClassSight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        video {
            transform: scaleX(-1); /* Mirror effect for natural feel */
            border-radius: 0.5rem;
            width: 100%;
            height: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            max-width: 640px;
            background-color: #000;
        }
        canvas { display: none; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="flex justify-between items-center glass-panel p-4 rounded-xl">
            <div class="flex items-center space-x-4">
                <button onclick="window.location.href='/select-subject'" class="text-slate-400 hover:text-white transition-colors">
                    &larr; Back
                </button>
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">ClassSight</h1>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">Sign Out</button>
        </header>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- Sidebar with Context -->
            <div class="space-y-4">
                <div class="glass-panel p-5 rounded-xl border border-slate-700/50">
                    <h3 class="font-semibold text-lg text-white border-b border-slate-700/50 pb-2 mb-3">Session Details</h3>
                    <div class="space-y-3 text-sm">
                        <div>
                            <p class="text-slate-400 text-xs uppercase tracking-wider">Room</p>
                            <p class="font-medium text-slate-200" id="info-room">Loading...</p>
                        </div>
                        <div>
                            <p class="text-slate-400 text-xs uppercase tracking-wider">Camera</p>
                            <p class="font-medium text-slate-200" id="info-camera">Loading...</p>
                        </div>
                        <div>
                            <p class="text-slate-400 text-xs uppercase tracking-wider">Assignment ID</p>
                            <p class="font-medium text-slate-200" id="info-assignment">Loading...</p>
                        </div>
                    </div>
                </div>

                <div id="status-card" class="glass-panel p-4 rounded-xl border border-blue-500/30 bg-blue-500/10 hidden">
                    <p class="text-blue-200 text-sm font-medium flex items-center">
                        <svg class="w-4 h-4 mr-2 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"></path></svg>
                        <span id="status-text">Initializing camera...</span>
                    </p>
                </div>
            </div>

            <!-- Main Camera Area -->
            <div class="md:col-span-2 glass-panel p-6 rounded-xl border border-slate-700 text-center flex flex-col items-center">
                
                <div class="relative rounded-lg overflow-hidden border-2 border-slate-700/50 mb-6 bg-slate-900 w-full max-w-[640px] flex justify-center">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" width="640" height="480"></canvas>
                    
                    <!-- Result Overlay -->
                    <div id="result-overlay" class="absolute inset-0 bg-slate-900/90 hidden flex flex-col items-center justify-center p-6 backdrop-blur-sm">
                        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mb-4 border border-emerald-500/30">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">Capture Successful</h3>
                        <p class="text-slate-300 text-sm mb-6 text-center">The image has been processed. (Recognition logic pending in future stage).</p>
                        <button onclick="resetCapture()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white font-medium transition-colors">
                            Capture Again
                        </button>
                    </div>
                </div>

                <button id="captureBtn" disabled
                        class="w-full max-w-xs py-4 px-8 bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-600 hover:to-emerald-600 text-white font-bold text-lg rounded-xl shadow-lg transform transition-all hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Take Photo
                </button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusCard = document.getElementById('status-card');
        const statusText = document.getElementById('status-text');
        const resultOverlay = document.getElementById('result-overlay');

        let stream = null;

        function init() {
            // Check context
            const roomId = sessionStorage.getItem('selectedRoomId');
            const cameraId = sessionStorage.getItem('selectedCameraId');
            const assignmentId = sessionStorage.getItem('selectedAssignmentId');
            
            if (!roomId || !cameraId || !assignmentId) {
                window.location.href = '/select-subject';
                return;
            }

            document.getElementById('info-room').textContent = `Room ID: ${roomId}`;
            document.getElementById('info-camera').textContent = `Camera ID: ${cameraId}`;
            document.getElementById('info-assignment').textContent = `Assignment ID: ${assignmentId}`;

            startCamera();
        }

        async function startCamera() {
            statusCard.classList.remove('hidden');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                
                statusCard.classList.replace('bg-blue-500/10', 'bg-emerald-500/10');
                statusCard.classList.replace('border-blue-500/30', 'border-emerald-500/30');
                statusCard.querySelector('svg').classList.remove('animate-pulse');
                statusCard.querySelector('svg').classList.add('text-emerald-400');
                statusText.textContent = "Camera active and ready";
                statusText.classList.replace('text-blue-200', 'text-emerald-200');
                
                captureBtn.disabled = false;
            } catch (err) {
                console.error("Camera error:", err);
                statusCard.classList.replace('bg-blue-500/10', 'bg-red-500/10');
                statusCard.classList.replace('border-blue-500/30', 'border-red-500/30');
                statusText.textContent = "Error accessing camera. Please check permissions.";
                statusText.classList.replace('text-blue-200', 'text-red-200');
            }
        }

        captureBtn.addEventListener('click', () => {
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...';

            const context = canvas.getContext('2d');
            // Draw mirrored image correctly
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            // Reset transform for future captures
            context.setTransform(1, 0, 0, 1, 0, 0);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');
                // Could also append roomId, cameraId, assignmentId here for the backend context

                try {
                    const response = await fetch('/capture', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        resultOverlay.classList.remove('hidden');
                    } else {
                        alert("Capture failed on server side.");
                        resetCaptureBtn();
                    }
                } catch (error) {
                    console.error("Upload error:", error);
                    alert("Network error during capture.");
                    resetCaptureBtn();
                }
            }, 'image/jpeg', 0.9);
        });

        window.resetCapture = function() {
            resultOverlay.classList.add('hidden');
            resetCaptureBtn();
        };

        function resetCaptureBtn() {
            captureBtn.disabled = false;
            captureBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> Take Photo';
        }

        window.logout = async function() {
            if(stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            await fetch('/auth/logout');
            window.location.href = '/login';
        };

        // Run init
        init();
    </script>
</body>
</html>
